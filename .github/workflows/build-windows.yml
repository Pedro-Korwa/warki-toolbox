name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.2'
        arch: 'win64_mingw'

    - name: Configure CMake
      run: |
        cmake -B build-ci -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: |
        cmake --build build-ci --config Release

    - name: Bundle Qt DLLs and MinGW Runtimes
      shell: powershell
      run: |
        # Jalankan windeployqt dengan flag runtime kompilator
        windeployqt --compiler-runtime build-ci/WarkiToolbox.exe
        
        # Ambil path folder bin MinGW/GCC di runner
        $gccPath = (Get-Command gcc).Source
        $binDir = Split-Path -Path $gccPath
        
        # Salin secara eksplisit DLL C++ MinGW yang sering ketinggalan
        Copy-Item "$binDir\libgcc_s_seh-1.dll" -Destination "build-ci\" -Force -ErrorAction SilentlyContinue
        Copy-Item "$binDir\libstdc++-6.dll" -Destination "build-ci\" -Force -ErrorAction SilentlyContinue
        Copy-Item "$binDir\libwinpthread-1.dll" -Destination "build-ci\" -Force -ErrorAction SilentlyContinue

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WarkiToolbox-Windows-x64
        path: build-ci/