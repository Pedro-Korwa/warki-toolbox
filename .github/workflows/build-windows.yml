name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.2'
        arch: 'win64_mingw'

    - name: Configure CMake
      run: |
        mkdir build-ci
        cd build-ci
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$env:Qt6_DIR

    - name: Build Project
      run: |
        cd build-ci
        cmake --build . --config Release

    - name: Bundle Qt DLLs (windeployqt)
      run: |
        $exePath = Get-ChildItem -Path build-ci -Filter *.exe -Recurse | Select-Object -ExpandProperty FullName -First 1
        windeployqt --no-compiler-runtime $exePath

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WarkiToolbox-Windows-x64
        path: |
          build-ci/*.exe
          build-ci/Release/*.exe
          build-ci/*.dll
          build-ci/Release/*.dll